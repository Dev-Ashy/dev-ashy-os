<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="50%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#12121e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Gradient orbs -->
  <circle cx="400" cy="300" r="400" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="1500" cy="800" r="350" fill="url(#glow2)" filter="url(#blur)"/>
  <circle cx="960" cy="540" r="500" fill="url(#glow1)" filter="url(#blur)" opacity="0.5"/>

  <!-- Grid -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1920" y2="0" stroke="white" stroke-width="1"/>
    <line x1="0" y1="60" x2="1920" y2="60" stroke="white" stroke-width="1"/>
    <line x1="0" y1="120" x2="1920" y2="120" stroke="white" stroke-width="1"/>
    <line x1="0" y1="180" x2="1920" y2="180" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1920" y2="240" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1920" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="360" x2="1920" y2="360" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1920" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="480" x2="1920" y2="480" stroke="white" stroke-width="1"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="white" stroke-width="1"/>
    <line x1="0" y1="600" x2="1920" y2="600" stroke="white" stroke-width="1"/>
    <line x1="0" y1="660" x2="1920" y2="660" stroke="white" stroke-width="1"/>
    <line x1="0" y1="720" x2="1920" y2="720" stroke="white" stroke-width="1"/>
    <line x1="0" y1="780" x2="1920" y2="780" stroke="white" stroke-width="1"/>
    <line x1="0" y1="840" x2="1920" y2="840" stroke="white" stroke-width="1"/>
    <line x1="0" y1="900" x2="1920" y2="900" stroke="white" stroke-width="1"/>
    <line x1="0" y1="960" x2="1920" y2="960" stroke="white" stroke-width="1"/>
    <line x1="0" y1="1020" x2="1920" y2="1020" stroke="white" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1320" y1="0" x2="1320" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1560" y1="0" x2="1560" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1680" y1="0" x2="1680" y2="1080" stroke="white" stroke-width="1"/>
    <line x1="1800" y1="0" x2="1800" y2="1080" stroke="white" stroke-width="1"/>
  </g>

  <!-- Logo -->
  <g transform="translate(860, 440)">
    <rect width="200" height="200" rx="40" fill="none" stroke="url(#glow1)" stroke-width="2"/>
    <text x="100" y="140" font-family="monospace" font-size="120" font-weight="bold" fill="white" text-anchor="middle">D</text>
  </g>

  <!-- Text -->
  <text x="960" y="700" font-family="monospace" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">DEV-ASHY OS</text>
  <text x="960" y="760" font-family="monospace" font-size="24" fill="#94a3b8" text-anchor="middle" opacity="0.7">Your developer workstation, rebuilt.</text>

  <!-- Terminal decoration -->
  <g transform="translate(760, 820)">
    <rect width="400" height="60" rx="8" fill="#0a0a12" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="38" font-family="monospace" font-size="16" fill="#22c55e">$</text>
    <text x="40" y="38" font-family="monospace" font-size="16" fill="#e2e8f0">dev-ashy-setup</text>
  </g>
</svg>
